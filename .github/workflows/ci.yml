name: CI — Build & Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: TypeScript Build + Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build production bundle
        # NOTE: GEMINI_API_KEY is intentionally not set here.
        # It is a Cloudflare Worker secret only, never a build-time variable.
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifact
        # Only store the artifact on pushes to main (not PRs) for auditability.
        # Deployment to Cloudflare requires explicit manual authorization per AGENTS.md.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
