    <!-- Self-healing dynamic asset recovery script (executes before any bundle loads) -->
    <script>
      (function() {
        var reloadKey = 'shiksha_cdn_reload';
        var now = Date.now();
        var lastReload = sessionStorage.getItem(reloadKey);
        
        function tryRecover(reason) {
          if (!lastReload || (now - parseInt(lastReload, 10) > 15000)) {
            sessionStorage.setItem(reloadKey, now.toString());
            console.warn('[Self-Healing] Critical asset loading failure (' + reason + '). Bypassing cache...');
            window.location.reload();
          }
        }

        window.addEventListener('error', function(event) {
          var target = event.target;
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
            var url = target.src || target.href;
            if (url && (url.indexOf('/assets/') !== -1 || url.indexOf('.js') !== -1 || url.indexOf('.css') !== -1)) {
              tryRecover('Failed resource load: ' + url);
            }
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var msg = (event.reason && (event.reason.message || event.reason.toString())) || '';
          if (
            msg.indexOf('ChunkLoadError') !== -1 ||
            msg.indexOf('Failed to fetch dynamically imported module') !== -1 ||
            msg.indexOf('Loading chunk') !== -1
          ) {
            tryRecover('Dynamic chunk import error');
          }
        });
      })();
