<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asset Not Found - ShikshaSahayak</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1224;
      color: #f3f4f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 500px;
    }
    h1 {
      color: #f97316;
      font-size: 3rem;
      margin: 0 0 10px 0;
    }
    h2 {
      font-size: 1.5rem;
      font-weight: 500;
      margin: 0 0 20px 0;
      color: #e5e7eb;
    }
    p {
      color: #9ca3af;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    a {
      display: inline-block;
      background-color: #f97316;
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-weight: 600;
      transition: background-color 0.2s;
    }
    a:hover {
      background-color: #ea580c;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <h2>Resource or Asset Not Found</h2>
    <p>The requested file or page does not exist. It may have been updated, moved, or deleted during a recent deployment. Please refresh the page to load the latest version.</p>
    <a href="/">Go to Homepage</a>
  </div>
</body>
</html>
