name = "shikshasahayak"
compatibility_date = "2024-03-01"
pages_build_output_dir = "dist"

# [triggers]
# crons = ["0 2 * * *"]

[[r2_buckets]]
binding = "MATERIALS_BUCKET"
bucket_name = "shiksha-materials-sandbox"

[[d1_databases]]
binding = "DB"
database_name = "keydocs-sandbox"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations-keydocs"

[[d1_databases]]
binding = "ASSESSMENT_DB"
database_name = "assessment-sandbox"
database_id = "00000000-0000-0000-0000-000000000002"

[[d1_databases]]
binding = "PADHAKU_CORE_DB"
database_name = "shiksha-core-sandbox"
database_id = "00000000-0000-0000-0000-000000000003"
migrations_dir = "migrations-shiksha-core"